name: Apply Manager Blog Draft
run-name: Apply manager blog draft / ${{ inputs.blogSlug }} / ${{ inputs.requestId }}

on:
  workflow_dispatch:
    inputs:
      requestId:
        description: 'Internal request id for manager status tracking'
        required: true
        type: string
      draftId:
        description: 'D1 draft id'
        required: true
        type: string
      blogSlug:
        description: 'Blog slug to update'
        required: true
        type: string
      payload:
        description: 'Base64 encoded blog draft payload'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: manager-content-${{ github.ref }}-${{ inputs.draftId }}
  cancel-in-progress: false

jobs:
  apply-blog-draft:
    name: Apply blog draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply blog draft
        id: apply
        env:
          MANAGER_BLOG_DRAFT_ID: ${{ inputs.draftId }}
          MANAGER_BLOG_SLUG: ${{ inputs.blogSlug }}
          MANAGER_BLOG_DRAFT_PAYLOAD: ${{ inputs.payload }}
        run: node scripts/apply-manager-blog-draft.mjs

      - name: Commit blog draft changes
        env:
          CONTENT_PATH: ${{ steps.apply.outputs.content_path }}
        run: node scripts/commit-manager-content.mjs blog
