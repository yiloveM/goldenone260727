name: Apply Manager review draft

on:
  workflow_dispatch:
    inputs:
      requestId:
        description: Manager request ID
        required: true
      draftId:
        description: D1 review draft ID
        required: true
      reviewId:
        description: Review record ID
        required: true
      payload:
        description: Base64-encoded review payload
        required: true

permissions:
  contents: write

concurrency:
  group: manager-content-${{ github.ref }}-${{ inputs.draftId }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply review draft
        id: apply
        env:
          MANAGER_REVIEW_DRAFT_PAYLOAD: ${{ inputs.payload }}
          MANAGER_REVIEW_ID: ${{ inputs.reviewId }}
        run: node scripts/apply-manager-review-draft.mjs
      - name: Commit review draft changes
        env:
          CONTENT_PATH: ${{ steps.apply.outputs.content_path }}
        run: node scripts/commit-manager-content.mjs review
