name: Publish Golden One Site
run-name: Deploy Golden One / ${{ inputs.requestId || github.sha }}

# Owner-locked: this is the only production site build/deploy workflow. The
# production Worker must remain disconnected from Cloudflare Workers Builds
# and its Git connection. A separately named preview Worker may build only an
# owner-approved remote preview branch.

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
      - '.agents/**'
      - '**/*.txt'
      - 'manager-portal/**'
      - 'src/content/products/**'
      - 'src/content/blog/**'
      - 'src/content/productTranslations/**'
      - 'src/content/blogTranslations/**'
      - 'src/keystatic/*.json'
      - 'src/data/site-language-settings.json'
      - 'src/data/catalog-downloads.json'
      - '.github/ai-translation-results/**'
  workflow_dispatch:
    inputs:
      requestId:
        description: Internal request id for manager status polling
        required: false
        default: manual
        type: string

permissions:
  contents: read

concurrency:
  group: goldenone-site-publish
  cancel-in-progress: false

jobs:
  deploy-cloudflare-worker:
    name: Build and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/run-wrangler.mjs whoami

      - name: Generate Cloudflare bindings
        run: npm run types:cloudflare

      - name: Report regenerated binding types
        shell: bash
        run: |
          if ! git diff --quiet -- worker-configuration.d.ts; then
            echo "::warning file=worker-configuration.d.ts::Bindings were regenerated from wrangler.toml for this deployment. Commit the generated file with the next configuration change."
            git diff -- worker-configuration.d.ts
          fi

      - name: Build the Astro site
        run: npm run build

      - name: Deploy the production Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:worker
