name: Publish Site
run-name: Publish site / ${{ inputs.requestId }}

on:
  workflow_dispatch:
    inputs:
      requestId:
        description: Internal request id for manager status polling
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: site-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-cloudflare-worker:
    name: Build and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare bindings
        run: npm run types:cloudflare

      - name: Report regenerated binding types
        shell: bash
        run: |
          if ! git diff --quiet -- worker-configuration.d.ts; then
            echo "::warning file=worker-configuration.d.ts::Bindings were regenerated from wrangler.toml for this deployment. Commit the generated file with the next configuration change."
            git diff -- worker-configuration.d.ts
          fi

      - name: Build the Astro site
        run: npm run build

      - name: Deploy the Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/run-wrangler.mjs deploy
