name = "goldenone"
# Wrangler resolves the Worker entry point as a file path in Workers Builds.
main = "./node_modules/@astrojs/cloudflare/dist/entrypoints/server.js"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"

[vars]
SITE_URL = ""
KEYSTATIC_GITHUB_REPO = "your-org/businessweb"
PUBLIC_KEYSTATIC_GITHUB_APP_SLUG = "businessweb-keystatic"
PUBLIC_R2_ASSET_BASE_URL = "https://cdn.example.com"

[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "businessweb-content"

[[d1_databases]]
binding = "MANAGER_DB"
database_name = "goldenone"
database_id = "2c5ddd64-6fe0-4fd9-af99-c100496ec872"
