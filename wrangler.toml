name = "goldenone"
# Wrangler resolves the Worker entry point as a file path in Workers Builds.
main = "./src/worker.ts"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
# The public site and both private portal domains share one asset bundle. Host
# isolation must therefore run before every static-asset lookup, including `/`.
run_worker_first = true

[vars]
SITE_URL = "https://goldenone.arkalpooltech.workers.dev"
PUBLIC_KEYSTATIC_GITHUB_REPO = "yiloveM/goldenone260727"
KEYSTATIC_PORTAL_HOST = "admin.ebr.kdns.fr/745b4f57-a455-401e-a6f6-705d0f4e69d6"
MANAGER_PORTAL_HOST = "manager.ebr.kdns.fr/c4b74037-3926-4ea6-b75b-5dd46f0b692f"
PUBLIC_KEYSTATIC_GITHUB_APP_SLUG = "goldenone260727"
PUBLIC_R2_ASSET_BASE_URL = "https://goldenone.arkalpooltech.workers.dev/r2"
# Change to "edge-webp" only after the custom domain transformation check in README succeeds.
PUBLIC_R2_IMAGE_DELIVERY_MODE = "original"

[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "goldenone"

[[d1_databases]]
binding = "MANAGER_DB"
database_name = "goldenone"
database_id = "2c5ddd64-6fe0-4fd9-af99-c100496ec872"
