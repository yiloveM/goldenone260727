name = "goldenone"
account_id = "473b41497c5031874c630ecb9bc45ced"
main = "./src/worker.ts"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]
# Preserve non-secret variables managed in the Cloudflare dashboard. Worker
# Secrets are preserved by Wrangler deployments independently of this setting.
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "none"
# The public site and both private portal domains share one asset bundle. Host
# isolation must therefore run before every static-asset lookup, including `/`.
run_worker_first = true

[vars]
SITE_URL = "https://goldenone.arkalpooltech.workers.dev"
PUBLIC_KEYSTATIC_GITHUB_REPO = "yiloveM/goldenone260727"
KEYSTATIC_PORTAL_HOST = "admin.ebr.kdns.fr"
MANAGER_PORTAL_HOST = "manager.ebr.kdns.fr"
PUBLIC_KEYSTATIC_GITHUB_APP_SLUG = "goldenone260727"
PUBLIC_R2_ASSET_BASE_URL = "https://goldenone.arkalpooltech.workers.dev/r2"
# Change to "edge-webp" only after the custom domain transformation check in README succeeds.
PUBLIC_R2_IMAGE_DELIVERY_MODE = "original"
ANALYTICS_ENABLED = "true"
# network stores only IPv4 /24 or IPv6 /48 prefixes. Use full only after a privacy review.
ANALYTICS_IP_MODE = "network"
ANALYTICS_RETENTION_DAYS = "365"
# Exact Search Console property, for example sc-domain:example.com. Empty disables the optional integration.
GSC_SITE_URL = ""

[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "goldenone"

[[d1_databases]]
binding = "MANAGER_DB"
database_name = "goldenone"
database_id = "2c5ddd64-6fe0-4fd9-af99-c100496ec872"
